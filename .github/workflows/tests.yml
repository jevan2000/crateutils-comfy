name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg (video and EXR tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python packages
        run: python -m pip install numpy "pillow>=11.3" opencv-python-headless
      - name: Unit tests (no ComfyUI needed)
        run: python -m unittest discover -s tests -v
